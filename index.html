<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pip-Boy Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pip: {
                DEFAULT: '#41ff00',  
    light: '#7fff5c',    
    dark: '#1a6600',     
    bg: '#111111',
              }
            },
            fontFamily: {
              mono: ['"VT323"', 'monospace'],
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'flicker': 'flicker 0.15s infinite',
              'modal-in': 'moda-in 0.2s ease-out forwards',
              'modal-out': 'modal-out 0.25s ease-in fowards',
              'backdrop-out': 'backdrop-out 0.25 ease-in fowards',
            },
            keyframes: {
              flicker: {
                '0%': { opacity: '0.9' },
                '50%': { opacity: '1.0' },
                '100%': { opacity: '0.9' },
              }
            },
            'modal-in': {
              '0%': { opacity: '0', transform: 'scale(0.9)'},
              '100%': { opacity: '1', transform: 'scale(1)'},
            },
            'modal-out': {
              '0%': { opacity: '1', transform: 'scale(1)'},
              '100%': { opacity: '1', transform: 'scale(1)'},
            },
            'backdrop-in': {
              '0%': { opacity: '0', transform: 'scale(0.9)'},
              '100%': {opacity: '1', transform: 'scale(1)'},
            },
            'backdrop-out': {
              '0%': { opacity: '1', transform: 'scale(1)'},
              '100%': {opacity: '0', transform: 'scale(0.85)'},
            },
          },
        }
      }
    </script>
    <style>
      body {
        background-color: #000;
        margin: 0;
        overflow: hidden;
      }
     
      ::-webkit-scrollbar {
  width: 8px;
}
::-webkit-scrollbar-track {
  background: #1a6600; 
::-webkit-scrollbar-thumb {
  background: #41ff00; 
}
::-webkit-scrollbar-thumb:hover {
  background: #7fff5c; 
}
      
      .scanline {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        position: fixed;
        pointer-events: none;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
      }
      
      .screen-glow {
        box-shadow: inset 0 0 100px rgba(16, 185, 129, 0.1);
        pointer-events: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 40;
      }
    </style>

</head>
  <body>
    <div id="root"></div>
     <script type="module" src="/index.tsx"></script>
  </body>
</html>
